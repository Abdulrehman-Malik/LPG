name: Staging Connectivity Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public staging URL
        shell: bash
        run: |
          set -e
          base="https://refine-marketplace-pen-frozen.trycloudflare.com/lpg/public/"
          echo "Checking $base"
          curl --fail --silent --show-error --location             --connect-timeout 15 --max-time 30             --output /tmp/lpg.html             --write-out "HTTP_STATUS=%{http_code}\nCONTENT_LENGTH=%{size_download}\n"             "$base"
          test -s /tmp/lpg.html

          echo "Checking login form..."
          form_action=$(grep -oE '<form action="[^"]+"' /tmp/lpg.html | head -1 | sed 's/.*action="//;s/"$//')
          echo "LOGIN_FORM_ACTION=$form_action"
          test "$form_action" = "$base"login

          echo "Checking login page fields..."
          grep -q '<title>Login' /tmp/lpg.html
          grep -q 'name="login"' /tmp/lpg.html
          grep -q 'name="password"' /tmp/lpg.html
          grep -q 'name="csrf' /tmp/lpg.html

          echo "Checking protected dashboard route..."
          dashboard_headers=$(curl --silent --show-error --location --max-redirs 0             --connect-timeout 15 --max-time 30             --output /dev/null --dump-header -             "$base/dashboard")
          echo "$dashboard_headers"
          dashboard_status=$(printf '%s' "$dashboard_headers" | awk 'tolower($1) ~ /^http/ {gsub("\r","",$1); print $2; exit}')
          echo "DASHBOARD_UNAUTH_STATUS=$dashboard_status"
          test "$dashboard_status" = "302"
          grep -qi 'location:.*login' <<< "$dashboard_headers"

          echo "STAGING_HTTP=PASS"
          echo "BASE_URL_CHECK=PASS"
          echo "LOGIN_PAGE_CHECK=PASS"
          echo "AUTH_GUARD_CHECK=PASS"
