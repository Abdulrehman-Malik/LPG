name: LPG Runtime QA

on:
  push:
    branches: [qa/runtime-deployment]
  workflow_dispatch:

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: perfect_lpg
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, mysqli
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Bootstrap database
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root < database/schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root perfect_lpg < database/migrations/007_20261003_pos_transaction_type.sql
          mysql -h 127.0.0.1 -P 3306 -u root perfect_lpg < database/migrations/008_20261003_individual_cylinder_tracking.sql
          mysql -h 127.0.0.1 -P 3306 -u root perfect_lpg < database/migrations/010_20261004_purchase_inventory_integrity.sql
          printf "SET @lpg_refresh_transactional_data = 0;\nSOURCE database/migrations/011_20261003_refresh_transactional_data.sql;\n" | mysql -h 127.0.0.1 -P 3306 -u root perfect_lpg

      - name: Prepare test environment
        run: |
          cp env .env
          sed -i 's#^app.baseURL.*#app.baseURL = http://127.0.0.1:8080/#' .env
          sed -i 's#^database.default.hostname.*#database.default.hostname = 127.0.0.1#' .env
          sed -i 's#^database.default.database.*#database.default.database = perfect_lpg#' .env
          sed -i 's#^database.default.username.*#database.default.username = root#' .env
          sed -i 's#^database.default.password.*#database.default.password = root#' .env
          sed -i 's#^CI_ENVIRONMENT.*#CI_ENVIRONMENT = testing#' .env

      - name: Start web application
        run: |
          nohup php spark serve --host 127.0.0.1 --port 8080 > /tmp/lpg-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ > /tmp/lpg-login.html; then exit 0; fi
            sleep 2
          done
          cat /tmp/lpg-server.log
          exit 1

      - name: HTTP runtime smoke tests
        run: |
          set -e
          curl -fsS http://127.0.0.1:8080/ | grep -qiE 'login|password'
          curl -fsS http://127.0.0.1:8080/login | grep -qiE 'login|password'
          curl -fsS http://127.0.0.1:8080/dashboard -o /tmp/dashboard.html || true
          test -s /tmp/dashboard.html

      - name: Browser UI QA (Playwright)
        run: |
          set -e
          mkdir -p /tmp/lpg-ui
          cd /tmp/lpg-ui
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          cat > /tmp/lpg-ui-qa.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
          const base = 'http://127.0.0.1:8080';

          try {
            await page.goto(base + '/login', { waitUntil: 'networkidle' });
            await page.screenshot({ path: '/tmp/login.png', fullPage: true });

            const username = page.locator('input[name="username"], input[type="text"]').first();
            const password = page.locator('input[name="password"], input[type="password"]').first();
            await username.fill('admin');
            await password.fill('admin123');
            await page.locator('button[type="submit"], input[type="submit"]').first().click();
            await page.waitForLoadState('networkidle');

            if (!page.url().includes('/dashboard')) throw new Error('Login did not reach dashboard');
            await page.screenshot({ path: '/tmp/dashboard-browser.png', fullPage: true });

            const dashboardText = await page.locator('body').innerText();
            for (const label of ['Total Sale', 'Cash Sale', 'Credit Sale', 'Payments', 'Stock Purchased']) {
              if (!dashboardText.toLowerCase().includes(label.toLowerCase())) {
                throw new Error('Dashboard metric missing: ' + label);
              }
            }

            const config = page.getByText('Configuration', { exact: false }).first();
            if (await config.count() === 0) throw new Error('Configuration menu not found');
            await config.click();
            await page.waitForTimeout(300);
            await page.screenshot({ path: '/tmp/configuration-clicked.png', fullPage: true });

            if (!(await page.locator('body').innerText()).toLowerCase().includes('configuration')) {
              throw new Error('Configuration menu content disappeared after click');
            }

            const overflow = await page.evaluate(() => ({
              htmlOverflow: getComputedStyle(document.documentElement).overflowY,
              bodyOverflow: getComputedStyle(document.body).overflowY,
              scrollHeight: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight),
              viewportHeight: window.innerHeight
            }));
            if (overflow.htmlOverflow === 'hidden' || overflow.bodyOverflow === 'hidden') {
              throw new Error('Vertical scrolling is explicitly hidden');
            }

            console.log('UI QA PASS', JSON.stringify(overflow));
          } finally {
            await browser.close();
          }
          EOF
          NODE_PATH=/tmp/lpg-ui/node_modules node /tmp/lpg-ui-qa.mjs

      - name: Run PHPUnit
        env:
          CI_ENVIRONMENT: testing
        run: php vendor/bin/phpunit --no-coverage

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-qa-logs
          path: |
            /tmp/lpg-server.log
            /tmp/lpg-login.html
            /tmp/dashboard.html
