name: LPG Runtime QA

on:
  push:
    branches:
      - main
      - qa/runtime-deployment
      - qa/runtime-deployment-verify
      - qa/workflow-cleanup
  workflow_dispatch:

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: perfect_lpg
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, mysqli
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Bootstrap database
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root < database/schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root perfect_lpg < database/migrations/007_20261003_pos_transaction_type.sql
          mysql -h 127.0.0.1 -P 3306 -u root perfect_lpg < database/migrations/008_20261003_individual_cylinder_tracking.sql
          mysql -h 127.0.0.1 -P 3306 -u root perfect_lpg < database/migrations/010_20261004_purchase_inventory_integrity.sql
          printf "SET @lpg_refresh_transactional_data = 0;\nSOURCE database/migrations/011_20261003_refresh_transactional_data.sql;\n" | mysql -h 127.0.0.1 -P 3306 -u root perfect_lpg
      - name: Prepare test environment
        run: |
          cp env .env
          sed -i "s# app.baseURL = 'http://localhost:180/LPG/public/'#app.baseURL = 'http://localhost:8080/'#" .env
          sed -i "s# app_baseURL = 'http://localhost:180/LPG/public/'#app_baseURL = 'http://localhost:8080/'#" .env
          cat >> .env <<'EOF'
          database.default.hostname = 127.0.0.1
          database.default.database = perfect_lpg
          database.default.username = root
          database.default.password = root
          database.default.DBDriver = MySQLi
          CI_ENVIRONMENT = testing
          EOF
      - name: Start web application
        run: |
          nohup php spark serve --host 0.0.0.0 --port 8080 > /tmp/lpg-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ > /tmp/lpg-login.html; then exit 0; fi
            sleep 2
          done
          cat /tmp/lpg-server.log
          exit 1
      - name: Run application migrations
        run: |
          set -e
          curl -fsS -L -X POST http://127.0.0.1:8080/migrations/run -o /tmp/migration-response.html
          if grep -qi migration_error /tmp/migration-response.html; then cat /tmp/migration-response.html; exit 1; fi
          curl -fsS http://127.0.0.1:8080/login -o /tmp/lpg-login-after-migrations.html
          grep -qi 'login' /tmp/lpg-login-after-migrations.html
          grep -qi 'password' /tmp/lpg-login-after-migrations.html
      - name: HTTP runtime smoke tests
        run: |
          set -e
          curl -fsS http://127.0.0.1:8080/ | grep -qiE 'login|password'
          curl -fsS http://127.0.0.1:8080/login | grep -qiE 'login|password'
          curl -fsS http://127.0.0.1:8080/dashboard -o /tmp/dashboard.html || true
          test -s /tmp/dashboard.html
      - name: Browser loopback probe (Playwright)
        run: |
          set -e
          mkdir -p /tmp/lpg-ui
          cd /tmp/lpg-ui
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8090 --bind 127.0.0.1 > /tmp/lpg-probe.log 2>&1 &
          PROBE_PID=$!
          trap 'kill $PROBE_PID 2>/dev/null || true' EXIT
          sleep 1
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy NO_PROXY=127.0.0.1,localhost node - <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--no-proxy-server','--disable-features=ProxyResolutionService']});
          const page = await browser.newPage();
          await page.goto('http://127.0.0.1:8090/', {waitUntil:'domcontentloaded', timeout:10000});
          console.log('CHROMIUM_LOOPBACK_PROBE_PASS', await page.title());
          await browser.close();
          EOF

      - name: Browser UI QA (Playwright)
        run: |
          set -e
          mkdir -p /tmp/lpg-ui
          cd /tmp/lpg-ui
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          cat > /tmp/lpg-ui/lpg-ui-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--no-proxy-server', '--disable-features=ProxyResolutionService'] });
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
          const base = 'http://localhost:8080';
          try {
            await page.goto(base + '/login', { waitUntil: 'networkidle' });
            await page.screenshot({ path: '/tmp/login.png', fullPage: true });
            const username = page.locator('input[name="login"]:visible, #login:visible').first();
            const password = page.locator('input[name="password"]:visible, #password:visible').first();
            await username.fill('admin');
            await password.fill('admin123');
            await page.locator('button[type="submit"], input[type="submit"]').first().click();
            await page.waitForLoadState('networkidle');
            if (!page.url().includes('/dashboard')) {
              console.log('LOGIN_DIAGNOSTIC_URL', page.url());
              console.log('LOGIN_DIAGNOSTIC_BODY', (await page.locator('body').innerText()).slice(0, 4000));
              throw new Error('Login did not reach dashboard: ' + page.url());
            }
            await page.screenshot({ path: '/tmp/dashboard-browser.png', fullPage: true });
            const dashboardText = await page.locator('body').innerText();
            for (const label of ['Total Sale', 'Cash Sale', 'Credit Sale', 'Payments', 'Stock Purchased']) {
              if (!dashboardText.toLowerCase().includes(label.toLowerCase())) throw new Error('Dashboard metric missing: ' + label);
            }
            const stockTab = page.locator('#stock-tab');
            await stockTab.click();
            await page.waitForTimeout(300);
            const stockText = await page.locator('#stock-pane').innerText();
            for (const label of ['Filled Cylinders', 'Empty Cylinders', 'Issued Temporarily Against Deposit']) {
              if (!stockText.toLowerCase().includes(label.toLowerCase())) throw new Error('Current stock metric missing: ' + label);
            }
            await page.locator('#summary-tab').click();
            await page.waitForTimeout(300);
            const config = page.getByText('Configuration', { exact: false }).first();
            if (await config.count() === 0) throw new Error('Configuration menu not found');
            await config.click();
            await page.waitForTimeout(300);
            await page.screenshot({ path: '/tmp/configuration-clicked.png', fullPage: true });
            if (!(await page.locator('body').innerText()).toLowerCase().includes('configuration')) throw new Error('Configuration menu content disappeared after click');
            const overflow = await page.evaluate(() => ({htmlOverflow:getComputedStyle(document.documentElement).overflowY,bodyOverflow:getComputedStyle(document.body).overflowY,scrollHeight:Math.max(document.documentElement.scrollHeight,document.body.scrollHeight),viewportHeight:window.innerHeight}));
            if (overflow.htmlOverflow === 'hidden' || overflow.bodyOverflow === 'hidden') throw new Error('Vertical scrolling is explicitly hidden');
            console.log('UI QA PASS', JSON.stringify(overflow));
          } finally { await browser.close(); }
          EOF
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy NO_PROXY=127.0.0.1,localhost node /tmp/lpg-ui/lpg-ui-qa.mjs
      - name: Run PHPUnit
        env:
          CI_ENVIRONMENT: testing
        run: php vendor/bin/phpunit --no-coverage
      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-qa-logs
          path: |
            /tmp/lpg-server.log
            /tmp/lpg-probe.log
            /tmp/lpg-login.html
            /tmp/dashboard.html
            /tmp/*.png
