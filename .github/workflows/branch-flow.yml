name: Branch Flow

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce-stage-to-main:
    name: Only stage can merge into main
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "stage" ]; then
            echo "::error::PRs into main must come from the 'stage' branch (feature -> stage -> main). Got '${{ github.head_ref }}'."
            exit 1
          fi
